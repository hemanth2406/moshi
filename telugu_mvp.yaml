# Real MVP — Roman Telugu + WhisperX-aligned turn-taking stereo
# Data folder must match Colab Step 2 output basename (stereo_roman_mvp).
# After unzip to RunPod Volume, rewrite jsonl paths to /workspace/... then train.
data:
  eval_data: '/workspace/stereo_roman_mvp/eval.jsonl'
  shuffle: true
  train_data: '/workspace/stereo_roman_mvp/train.jsonl'

# model
moshi_paths:
  hf_repo_id: "kyutai/moshiko-pytorch-bf16"

full_finetuning: false # Activate lora.enable if partial finetuning
lora:
  enable: true # Set to False if full_finetuning is True
  rank: 64
  scaling: 2.
  ft_embed: false # Keep false for standard LoRA; true trains text embeddings (more params / risk)

first_codebook_weight_multiplier: 100.
text_padding_weight: .5

# optim — duration_sec must match notebook MAX_STEREO_SEC (pairs longer than this are dropped)
duration_sec: 30
batch_size: 4
max_steps: 2000
gradient_checkpointing: true
optim:
  lr: 2e-6
  weight_decay: 0.1
  pct_start: 0.05

# other
seed: 0
log_freq: 10
eval_freq: 200
do_eval: false
do_ckpt: true
ckpt_freq: 200

save_adapters: true # Must be False if full_finetuning is True

run_dir: "/workspace/runs/telugu_roman_mvp"

# This part is optional and can be kept commented out
# wandb:
#   project: "" # your wandb project name
#   run_name: "" # your wandb run name
#   key: "" # your wandb api key
#   offline: False
